[workspace]
resolver = "2"
members = ["demeter-core", "demeter-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
fastnum = "0.7"
ruint = "1.20"
chrono = "0.4"
thiserror = "2"
polars = { version = "0.55", default-features = false, features = ["lazy", "csv", "ipc", "parquet", "temporal", "dtype-datetime", "dtype-decimal", "dtype-i128", "fmt"] }
pyo3 = { version = "0.29" }

[profile.release]
lto = "thin"
codegen-units = 1
