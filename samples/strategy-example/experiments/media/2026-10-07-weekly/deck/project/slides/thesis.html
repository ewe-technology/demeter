<p style="font-size:28px;color:#D6E2FA;font-family:'IBM Plex Mono', 'Courier New', monospace;letter-spacing:2px">一句話結論</p>
<h2 style="font-size:80px;font-weight:900;line-height:1.25">試了 9 類變化，<br>真正有用的只有 2 類：<br>refill 時機、swap routing</h2>
<p style="font-size:40px;color:#E4ECFB;line-height:1.5">其他規則大多是「ETH 變好、BTC 變差」或反過來，<br>換一個池子或換一段時間就不成立。</p>
<aside>先講結論。9 類裡面，真正站得住的是 refill 時機的 no-new-low 規則，以及把 rebuild 的 swap 改走便宜的池子。其他大多數規則有一個共同模式：在一個資產上變好，在另一個資產上變差。</aside>
